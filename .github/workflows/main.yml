name: Deploy Backend to DigitalOcean Droplet

on:
  push:
    branches:
      - testing-server
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine deployment target
        id: deployment
        run: |
          if [ "${{ github.ref_name }}" == "master" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "server_ip=${{ secrets.PRODUCTION_SERVER_IP }}" >> $GITHUB_OUTPUT
            echo "deploy_dir=/root/forby/backend/production" >> $GITHUB_OUTPUT
            echo "container_name=forby-backend-prod" >> $GITHUB_OUTPUT
            echo "branch=master" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "testing-server" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "server_ip=104.248.80.243" >> $GITHUB_OUTPUT
            echo "deploy_dir=/root/forby/backend/flowback-backend" >> $GITHUB_OUTPUT
            echo "container_name=forby-backend" >> $GITHUB_OUTPUT
            echo "branch=testing-server" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DIGITALOCEAN_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ steps.deployment.outputs.server_ip }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh root@${{ steps.deployment.outputs.server_ip }} << EOF
            # Set variables
            export DEPLOY_DIR="${{ steps.deployment.outputs.deploy_dir }}"
            export CONTAINER_NAME="${{ steps.deployment.outputs.container_name }}"
            export BRANCH="${{ steps.deployment.outputs.branch }}"

            # Navigate to deployment directory
            cd "\$DEPLOY_DIR"

            # Setup SSH agent for git operations
            eval "\$(ssh-agent -s)"
            ssh-add /root/.ssh/forby_frontend_rsa

            # Pull latest code
            git fetch origin
            git checkout \$BRANCH
            git reset --hard origin/\$BRANCH

            # Rebuild Docker image
            docker build -t \$CONTAINER_NAME .

            # Stop and remove old container
            docker stop \$CONTAINER_NAME || true
            docker rm \$CONTAINER_NAME || true

            # Start new container with updated code
            docker run -d \\
              --name \$CONTAINER_NAME \\
              --restart unless-stopped \\
              -p 8000:8000 \\
              -v /root/forby_backend_env_backup.txt:/app/.env \\
              \$CONTAINER_NAME \\
              gunicorn backend.wsgi:application --bind 0.0.0.0:8000

            # Wait for container to start
            sleep 5

            # Run migrations
            docker exec \$CONTAINER_NAME python manage.py migrate

            # Check if container is running
            if ! docker ps | grep -q \$CONTAINER_NAME; then
              echo "ERROR: Container failed to start"
              docker logs \$CONTAINER_NAME --tail 50
              exit 1
            fi

            echo "Deployment successful! Container \$CONTAINER_NAME is running."
          EOF
